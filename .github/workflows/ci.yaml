name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

env:
  NODE_VERSION: 22

jobs:
  build-and-lint:
    runs-on: ubuntu-22.04
    name: Build and Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build packages
        run: pnpm build:packages

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm -s check-types

      - name: ESM runtime smoke
        run: |
          cd apps/api
          timeout 10 node ./dist/main.js > /tmp/runtime-smoke.log 2>&1 || true
          # We don't care about exit code — we care about WHICH error appeared in stderr.
          # Loader-phase + bundler-output errors fire in the first ~500 ms BEFORE Nest
          # tries to connect to Postgres/Redis/etc. A clean DB-connection error proves
          # loading + DI initialization succeeded. Any of the patterns below proves it didn't.
          if grep -qE "ERR_REQUIRE_ESM|Cannot use import statement|ERR_UNKNOWN_FILE_EXTENSION|ERR_PACKAGE_PATH_NOT_EXPORTED|Reflect\.metadata is not a function|decorators are not supported|Cannot find module '@packages/" /tmp/runtime-smoke.log; then
            echo "Loader/bundler error detected — failing"
            cat /tmp/runtime-smoke.log
            exit 1
          fi
          echo "No loader or bundler errors detected"

      - name: Build tests
        run: pnpm build:tests

      - name: Lint
        run: pnpm lint

  unit-tests:
    runs-on: ubuntu-22.04
    name: Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build packages
        run: pnpm build:packages

      - name: Build
        run: pnpm build

      - name: Build tests
        run: pnpm build:tests

      - name: Run unit tests
        run: pnpm test:unit

  integration-tests:
    runs-on: ubuntu-22.04
    name: Integration Tests
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build packages
        run: pnpm build:packages

      - name: Build
        run: pnpm build

      - name: Build tests
        run: pnpm build:tests

      # Postgres, Redis, and Qdrant are spawned per-run via testcontainers from
      # apps/api/src/__tests__/integration/global-setup.ts — no `services:`
      # block is needed. GitHub-hosted runners ship Docker, which testcontainers
      # uses to manage the container lifecycle.
      - name: Run integration tests
        run: pnpm test:integration

  ci-pass:
    name: CI Pass
    if: always()
    needs:
      - build-and-lint
      - unit-tests
      - integration-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all required jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
